<html lang="ko" data-nav="w">
<head>
<meta name="robots" content="noindex, nofollow">
<script>/* 승인된 팀원만: PLYSH 로그인(접속 승인)을 거친 기기만 열림. 안 됐으면 PLYSH 로그인으로 */try{if(localStorage.getItem('d4:ok')!=='1')location.replace('../plysh/')}catch(e){location.replace('../plysh/')}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PROOF</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PROOF">

<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* PROOF (2026-11-22): 사양서 도우미(proof) · 상품 사양서(formly) · 라벨 생성기(label)를 한 주소로.
   메뉴 구조는 PLYSH와 같게 (PC 왼쪽 메뉴 대메뉴 > 중메뉴 > 소메뉴, 모바일 위 칩 줄).
   화면 내용은 PLYSH 안 도구(plysh/tools/proof, plysh/tools/formly)를 그대로 불러옴 → 고치면 두 곳이 같이 바뀜 */
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1; --fw:560px; --sw:232px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable', Pretendard, -apple-system, sans-serif; font-size:15px; letter-spacing:-0.01em; }
button { font:inherit; color:inherit; cursor:pointer; }
.hide { display:none !important; }
.nvi { width:16px; height:16px; flex:none; }
/* 머리 */
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:var(--fw); margin:0 auto; gap:12px; }
.brand { border:0; background:none; padding:0; font-size:18px; font-weight:800; letter-spacing:.06em; color:var(--txt); }
.hd a.ib { flex:none; display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 13px; border-radius:999px; background:#fff; color:var(--sub); font-size:13px; font-weight:600; text-decoration:none; }
.hd a.ib svg { width:15px; height:15px; }
#ncr { display:none; flex:1; min-width:0; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--mute); white-space:nowrap; overflow:hidden; }
#ncr b { color:var(--sub); font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; }
#ncr svg { width:12px; height:12px; flex:none; color:var(--faint); }
/* 모바일 칩 줄 */
#nsub { display:flex; max-width:var(--fw); margin:8px auto 0; padding:0 0 10px; gap:6px; overflow-x:auto; scrollbar-width:none; align-items:center; }
#nsub::-webkit-scrollbar { display:none; }
#nsub button { flex:none; border:0; background:#fff; border-radius:999px; padding:8px 13px; font-size:13px; font-weight:600; color:var(--sub); }
#nsub button.on { background:var(--txt); color:#fff; }
#nsub i { flex:none; font-style:normal; font-size:11px; font-weight:700; color:var(--faint); padding:0 2px 0 8px; letter-spacing:.03em; }
#nsub i:first-child { padding-left:0; }
/* 페이지 머리: 제목 24px + 한 줄 설명 14px */
#npg { position:relative; max-width:calc(var(--fw) + 32px); margin:0 auto; padding:18px 16px 20px; }
#npg h1 { margin:0; font-size:24px; font-weight:800; letter-spacing:-0.03em; line-height:1.3; color:var(--txt); }
#npg p { margin:6px 0 0; font-size:14px; font-weight:500; line-height:1.5; color:var(--mute); letter-spacing:-0.01em; }
#npg p:empty { display:none; }
@media (max-width:1023px) { #npg { display:none; } #tkWrap { padding-top:4px; } }
/* 도구 화면 */
#tkWrap { max-width:calc(var(--fw) + 32px); margin:0 auto; }
#tkWrap iframe { display:block; width:100%; border:0; background:var(--bg); }
iframe.fmon { position:relative; z-index:2000 !important; }
#fmDim { position:fixed; inset:0; z-index:1999; pointer-events:none; } #fmCat { position:fixed; inset:0; z-index:1998; }
/* PC: 왼쪽 메뉴 */
#nsd { display:none; }
@media (min-width:1024px) {
  :root { --fw:960px; }
  body { padding-left:var(--sw); }
  header { padding-left:40px; padding-right:40px; }
  header .brand { display:none; }
  #ncr { display:flex; }
  #nsub { display:none; }
  #npg { max-width:calc(var(--fw) + 80px); padding:26px 40px 24px; }
  #tkWrap { max-width:calc(var(--fw) + 80px); padding:0 24px 64px; }
  #nsd { display:block; position:fixed; left:0; top:0; bottom:0; width:var(--sw); background:#fff; border-right:1px solid var(--line); padding:16px 12px 30px; overflow:auto; z-index:12; scrollbar-width:thin; }
}
#nsd .sbh { display:flex; align-items:center; padding:4px 10px 14px; }
#nsd .sbh button { border:0; background:none; padding:0; font-size:18px; font-weight:800; letter-spacing:.06em; color:var(--txt); }
#nsd .ss { display:flex; align-items:center; gap:10px; width:100%; min-height:42px; border:0; background:none; text-align:left; padding:0 12px; border-radius:12px; font-size:16px; font-weight:700; color:var(--txt); margin-top:2px; cursor:default; }
#nsd .ss .nvi { width:18px; height:18px; color:var(--txt); }
#nsd .si { display:flex; align-items:center; width:100%; min-height:40px; border:0; background:none; text-align:left; padding:0 12px 0 40px; margin-top:2px; border-radius:12px; font-size:15px; font-weight:500; color:var(--sub); }
#nsd .si:hover { background:var(--bg); }
#nsd .si.on { background:var(--txt); color:#fff; font-weight:600; }
#nsd .sx { padding-bottom:6px; }
#nsd .sft { margin:18px 0 0; padding:14px 12px 0; border-top:1px solid var(--line); }
#nsd .sft a { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--mute); text-decoration:none; }
#nsd .sft a svg { width:14px; height:14px; }
/* 소메뉴 (용어사전 > 인쇄 / 디자인 > 세부 분류) */
.s3 { margin:2px 0 6px; padding-left:40px; }
.s3 button { display:flex; align-items:center; gap:8px; width:100%; min-height:34px; border:0; background:none; text-align:left; padding:0 12px; border-radius:10px; font:inherit; font-size:14px; font-weight:500; color:var(--mute); cursor:pointer; position:relative; }
.s3 button:before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:2px; border-radius:1px; background:var(--line); }
.s3 button:hover { background:var(--bg); color:var(--sub); }
.s3 button.on { color:var(--txt); font-weight:700; } .s3 button.on:before { background:var(--txt); }
.s3 button small { margin-left:auto; font-size:11.5px; font-weight:600; color:var(--faint); }
.s3 button.pt { color:var(--sub); font-weight:600; } .s3 button.pt.op { color:var(--txt); font-weight:700; } .s3 button.pt:before { display:none; }
.s3 button.pt .cv { margin-left:auto; margin-right:4px; width:7px; height:7px; border-right:1.6px solid currentColor; border-bottom:1.6px solid currentColor; transform:rotate(-45deg); opacity:.55; }
.s3 button.pt.op .cv { transform:rotate(45deg); margin-top:-3px; }
.s3 button.s4 { padding-left:24px; min-height:32px; font-size:13.5px; } .s3 button.s4:before { left:12px; }
html.s3pc .rnav { display:none; }
</style>
</head>
<body>
<nav id="nsd" aria-label="메뉴"></nav>
<header>
  <div class="hd">
    <button class="brand" id="brand" type="button">PROOF</button>
    <div id="ncr"></div>
    <a class="ib" id="toPly" href="../plysh/" title="PLYSH 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>PLYSH</a>
  </div>
  <div id="nsub"></div>
</header>
<div id="npg"><h1 id="pgT"></h1><p id="pgD"></p></div>
<div id="tkWrap"></div>
<script>
// 도구가 있는 곳 (PLYSH 저장소 안). 이 앱은 화면 틀(메뉴)만 맡음
var BASE = '../plysh/';
var $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
var IC = {
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  calc: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
  ref: '<path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zm0 0a2 2 0 0 0 2 2h13"/>',
  cv: '<path d="M9 6l6 6-6 6"/>'
};
function nvi(k) { return '<svg class="nvi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + IC[k] + '</svg>'; }
// 메뉴 이름 · 설명은 PLYSH 도우미 메뉴와 같게
var MENU = [
  { g: '작성', ic: 'pen', i: [
    { k: 'doc', t: '지류 사양서 작성', s: '품목을 모아 MASTER 양식 순서로 사양서 만들기', f: 'tools/proof/', pv: 'doc' },
    { k: 'formly', t: '상품 라벨 생성기', s: '굿즈 상품 사양서와 라벨 문구, 엑셀·시트로 저장', f: 'tools/formly/' }] },
  { g: '계산', ic: 'calc', i: [
    { k: 'cut', t: '종이연수·칼선', s: '완성 크기·칼선 형태로 원판 걸이와 필요 전지(연) 수, 전개도 일러스트 파일', f: 'tools/proof/', pv: 'calc' }] },
  { g: '자료', ic: 'ref', i: [
    { k: 'pt', t: '팬톤', s: '팬톤 번호·CMYK 근사값 찾기', f: 'tools/proof/', pv: 'pt' },
    { k: 'ref', t: '용어사전', s: '인쇄·후가공·제본 용어와 디자인 용어', f: 'tools/proof/', pv: 'ref' }] }
];
// 메뉴엔 없지만 사양서 안에서 넘어가는 화면
var EXTRA = [{ k: 'items', t: '지류 품목', s: '대표 품목별 사양 예시, 골라서 사양서에 담기', f: 'tools/proof/', pv: 'list', up: 'doc' }];
var LIST = []; MENU.forEach(function (g) { g.i.forEach(function (x) { x.g = g.g; LIST.push(x); }); }); EXTRA.forEach(function (x) { x.g = '작성'; LIST.push(x); });
// 예전 주소·저장값 → 새 메뉴 (proof 예전 화면 이름, formly·label 주소에서 넘어올 때)
var OLD = { proof: 'doc', list: 'items', one: 'items', calc: 'cut', die: 'cut', label: 'formly' };
function item(k) { return LIST.filter(function (x) { return x.k === k; })[0]; }
var S = { k: 'doc' }, SUB = { sig: '', refIn: 0, refOpen: '' };
var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function go(k, fromTool) {
  k = OLD[k] || k; var t = item(k); if (!t) t = item('doc');
  S.k = t.k; ls.set('pf:k', t.k);
  var h = '#' + t.k; if (location.hash !== h) try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) {}
  if (t.k === 'ref' && !fromTool) SUB.refIn = 0;
  paint();
  $$('#tkWrap iframe').forEach(function (f) { f.classList.toggle('hide', f.dataset.f !== t.f); });
  var f = $('#tkWrap iframe[data-f="' + t.f + '"]');
  if (!f) {
    f = document.createElement('iframe'); f.dataset.f = t.f; f.title = t.t;
    f.onload = function () { f._ok = 1; tidy(f); tkGo(f); };
    f.src = BASE + t.f + (t.pv ? '#' + t.pv : ''); $('#tkWrap').appendChild(f);
  }
  f._pv = t.pv || ''; if (f._ok && !fromTool) tkGo(f);
  if (!fromTool) window.scrollTo(0, 0);
  FS.h = 0; setTimeout(fsTick, 30);
}
function tkGo(f) { try { if (f._pv && f.contentWindow.plyshGo) { if (f._pv === 'ref' && f.contentWindow.plyshRefHome) f.contentWindow.plyshRefHome(); f.contentWindow.plyshGo(f._pv); } } catch (e) {} }
// 도구 안에서 화면을 옮기면(예: 사양서 → 지류 품목) 메뉴도 같이
window.plyshSync = function (file, pv) {
  var t = LIST.filter(function (x) { return x.f === file && x.pv === pv; })[0];
  if (!t || t.k === S.k) return; var f = $('#tkWrap iframe[data-f="' + file + '"]'); if (f) f._pv = pv; go(t.k, 1);
};
function paint() {
  var t = item(S.k), on = t.up || t.k;
  $('#pgT').textContent = t.t; $('#pgD').textContent = t.s || ''; document.title = t.t + ' · PROOF';
  $('#ncr').innerHTML = '<span>' + esc(t.g) + '</span>' + nvi('cv') + '<b>' + esc(t.t) + '</b>';
  $('#nsd').innerHTML = '<div class="sbh"><button type="button" data-go="doc">PROOF</button></div>' + MENU.map(function (g) {
    return '<div class="sx"><div class="ss">' + nvi(g.ic) + esc(g.g) + '</div>' + g.i.map(function (x) { return '<button type="button" class="si' + (x.k === on ? ' on' : '') + '" data-go="' + x.k + '">' + esc(x.t) + '</button>'; }).join('') + '</div>';
  }).join('') + '<div class="sft"><a href="../plysh/">' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>PLYSH로 가기</a></div>';
  $('#nsub').innerHTML = MENU.map(function (g) { return '<i>' + esc(g.g) + '</i>' + g.i.map(function (x) { return '<button type="button" data-go="' + x.k + '"' + (x.k === on ? ' class="on"' : '') + '>' + esc(x.t) + '</button>'; }).join(''); }).join('');
  $$('[data-go]').forEach(function (b) { b.onclick = function () { go(b.dataset.go); }; });
  var c = $('#nsub .on'); if (c) try { c.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {}
  SUB.sig = ''; subTick();
}
$('#brand').onclick = function () { go('doc'); };

/* PLYSH 안에서 열린 것처럼: 도구 자체 제목·로고는 숨김 (PLYSH EMB_TIDY와 같은 규칙) */
var TIDY = '.wrap > h2.noprint:first-child, .wrap > div.noprint:first-child > h2, .wrap > div.noprint:first-child > .lead { display:none !important; }'
  + '.phd:not(:has(.bk)) { display:none !important; } .hbar > .logo { display:none !important; }'
  + 'html, body { font-family:"Pretendard Variable", Pretendard, -apple-system, sans-serif; }'
  + 'html.emb main { padding-top:0 !important; } .wrap { padding-top:0 !important; } #fxBar { padding-top:0 !important; } .emb-segw { padding-top:0 !important; }'
  + 'html.emb #lnk { display:none !important; } html.emb header .header-right { padding-top:0 !important; } html.emb body > #app > header, html.emb body > header { padding-top:0 !important; } .hbar { height:auto !important; padding-top:0 !important; padding-bottom:8px !important; }';
function tidy(f) { try { var d = f.contentDocument; if (!d || d.getElementById('plyTidy')) return; var st = d.createElement('style'); st.id = 'plyTidy'; st.textContent = TIDY; (d.head || d.documentElement).appendChild(st); } catch (e) {} }

/* 소메뉴: 용어사전 > 인쇄 / 디자인 > 세부 분류 (PLYSH와 같음, 지금 보는 파트만 펼침) */
function subItems() {
  var L = []; if (S.k !== 'ref') { SUB.refIn = 0; return L; }
  if (!SUB.refIn) { SUB.refIn = 1; SUB.refOpen = ''; }
  try {
    var f = $('#tkWrap iframe[data-f="tools/proof/"]'), d = f && f.contentDocument; if (!d) return L;
    var PT = [], cur = null;
    $$('.rnav .rtab > *', d).forEach(function (e) {
      if (e.classList.contains('rph')) { cur = { t: e.textContent.trim(), k: [] }; PT.push(cur); }
      else if (cur && e.tagName === 'BUTTON' && !e.classList.contains('rdm')) { var sm = e.querySelector('small'); cur.k.push({ t: (sm ? e.firstChild.textContent : e.textContent).trim(), n: sm ? sm.textContent : '', on: e.classList.contains('on'), lv: 1, go: function () { e.click(); } }); }
    });
    PT.forEach(function (pt) {
      var on = pt.k.some(function (x) { return x.on; }), op = SUB.refOpen === pt.t;
      L.push({ t: pt.t, part: 1, on: on, open: op, go: function () { SUB.refOpen = op ? '' : pt.t; SUB.sig = ''; } });
      if (op) L = L.concat(pt.k);
    });
  } catch (e) {}
  return L;
}
function subHide(on) {
  var f = $('#tkWrap iframe[data-f="tools/proof/"]'), d; try { d = f && f.contentDocument; } catch (e) { d = null; }
  if (d && d.head) { var st = d.getElementById('s3hide'); if (on && !st) { st = d.createElement('style'); st.id = 's3hide'; st.textContent = '@media (min-width:900px) { .rnav { display:none !important; } .rfx { grid-template-columns:minmax(0, 1fr) !important; } }'; d.head.appendChild(st); } else if (!on && st) st.remove(); }
}
function subTick() {
  var sd = $('#nsd'), pc = !!(sd && sd.offsetWidth), L = subItems();
  subHide(pc && S.k === 'ref' && L.length > 0);
  var sig = S.k + '|' + L.map(function (x) { return x.t + (x.n || '') + (x.on ? '*' : '') + (x.open ? '+' : ''); }).join(',');
  if (sig === SUB.sig && (!L.length || $('.s3', sd))) return; SUB.sig = sig;
  $$('.s3', sd).forEach(function (e) { e.remove(); });
  var on = $('.si.on', sd); if (!L.length || !on) return;
  var w = document.createElement('div'); w.className = 's3';
  w.innerHTML = L.map(function (x, i) { return '<button type="button" data-s3="' + i + '" class="' + (x.part ? 'pt' + (x.open ? ' op' : '') : x.lv ? 's4' + (x.on ? ' on' : '') : (x.on ? 'on' : '')) + '">' + esc(x.t) + (x.part ? '<i class="cv"></i>' : '') + (x.n ? '<small>' + esc(x.n) + '</small>' : '') + '</button>'; }).join('');
  on.parentNode.insertBefore(w, on.nextSibling);
  $$('[data-s3]', w).forEach(function (b) { b.onclick = function () { var x = L[+b.dataset.s3]; if (x && x.go) x.go(); setTimeout(subTick, 60); }; });
}
setInterval(subTick, 500);

/* 스크롤바 하나만, 화면 오른쪽 끝에 (PLYSH와 같은 방식): 도구 화면은 화면 높이로 위에 붙여 두고,
   바깥 페이지 길이를 도구 내용 길이만큼 늘린 뒤 창 스크롤을 도구 안 스크롤로 옮겨 준다 */
var FS = { f: null, w: null, h: 0, lock: 0 };
function fsTop() { var h = $('header'); return h ? Math.max(0, h.getBoundingClientRect().bottom) : 0; }
function fsTick() {
  var f = $('#tkWrap iframe:not(.hide)'), w = $('#tkWrap');
  if (FS.f && FS.f !== f) { FS.f.style.position = ''; FS.f.style.top = ''; FS.h = 0; }
  FS.f = f; FS.w = w; if (!f) return;
  var d; try { d = f.contentDocument; } catch (e) { return; } if (!d || !d.documentElement) return;
