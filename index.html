  $$('[data-srt]').forEach(function (b) { b.onclick = function () { PT.sort = { '번호순': 'no', '색상순': 'hue', '밝은순': 'lt' }[b.dataset.srt]; renderPt(); }; });
  $$('[data-vm]').forEach(function (b) { b.onclick = function () { PT.mode = b.dataset.vm === '그리드' ? 'grid' : 'list'; ls.set('pr:ptmode', PT.mode); renderPt(); }; });
  $('#ptH').oninput = function () { PT.q = this.value; var p = this.selectionStart; renderPt(); var i = $('#ptH'); i.focus(); i.setSelectionRange(p, p); };
  $('#ptC').oninput = function () { PT.tgt = this.value; PT.q = ''; clearTimeout(PT.th); PT.th = setTimeout(renderPt, 120); };
  if ($('#ptClr')) $('#ptClr').onclick = function () { PT.tgt = ''; PT.q = ''; renderPt(); };
  $('#ptF').onchange = function () { var f = this.files[0]; if (f) ptImage(f); };
  $$('[data-pc]').forEach(function (b) { b.onclick = function () { var p = b.dataset.pc.split(':'); ptDetail(PT.L[p[0]][+p[1]]); }; });
}
function ptImage(f) {
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var el = $('#pk'), W = Math.min(520, img.width), H = Math.round(img.height * W / img.width);
    el.innerHTML = '<div class="pkb"><div class="pkh"><b>사진에서 색 고르기</b><button id="pkX">×</button></div><div class="nt">사진을 눌러서 색을 찍어요 (주변 5×5 평균)</div><canvas id="ptPic" width="' + W + '" height="' + H + '" style="width:100%;border-radius:12px;touch-action:none;cursor:crosshair"></canvas><div class="ptt" id="ptPv"></div><div class="acts"><button class="sv" id="pkOk">이 색으로 찾기</button></div></div>';
    el.style.display = 'flex'; document.body.style.overflow = 'hidden';
    var cv = $('#ptPic'), cx = cv.getContext('2d'); cx.drawImage(img, 0, 0, W, H); URL.revokeObjectURL(url);
    var pick = '', close = function () { el.style.display = 'none'; el.innerHTML = ''; document.body.style.overflow = ''; };
    cv.onclick = function (e) { var r = cv.getBoundingClientRect(), x = Math.round((e.clientX - r.left) * W / r.width), y = Math.round((e.clientY - r.top) * H / r.height), d = cx.getImageData(Math.max(0, x - 2), Math.max(0, y - 2), 5, 5).data, s = [0, 0, 0], n = d.length / 4; for (var i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; } pick = rgb2hex(s.map(function (v) { return v / n; })); $('#ptPv').innerHTML = '<span style="background:' + pick + '"></span><b>' + pick.toUpperCase() + '</b>'; };
    $('#pkX').onclick = close; $('#pkOk').onclick = function () { if (pick) { PT.tgt = pick; PT.q = ''; } close(); renderPt(); };
  };
  img.src = url;
}
function ptDetail(c) {
  var el = $('#pk'), key = c.lib + ':' + c.n, fav = PT.fav.indexOf(key) >= 0, cm = cmykOf(c.rgb), lab = c.lab.map(function (v) { return Math.round(v); });
  var twin = Object.keys(PT.L).filter(function (k) { return k !== c.lib && (k === 'C' || k === 'U'); }).map(function (k) { return PT.L[k].filter(function (x) { return x.n === c.n; })[0]; }).filter(Boolean);
  var nn = nearest(c.lab, c.lib, 8, c);
  var h = '<div class="pkb ptd"><div class="pkh"><b>' + esc(ptName(c)) + '</b><button id="pkX">×</button></div><div class="pkl" style="padding:14px">';
  h += '<div class="big" style="background:' + c.hex + '"></div>';
  h += '<div class="pdv">' + [['HEX', c.hex.toUpperCase()], ['RGB', c.rgb.join(', ')], ['CMYK ≈', cm.join(', ')], ['Lab', lab.join(', ')], ['라이브러리', PTLIB[c.lib][0] + ' · ' + PTLIB[c.lib][2]]].map(function (r) { return '<div data-cp="' + esc(r[1]) + '"><small>' + r[0] + '</small><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div>';
  h += '<div class="acts"><button class="rs" data-cp="' + esc(ptName(c)) + '">이름 복사</button><button class="rs" data-cp="별색 (' + esc(ptName(c)) + ')">사양서 별색 문구</button><button class="rs" id="ptFv">' + (fav ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기') + '</button></div>';
  if (twin.length) h += '<div class="ct" style="margin-top:14px">같은 번호 · 다른 종이</div>' + twin.map(function (t) { return swl(t, '<em>ΔE ' + de00(c.lab, t.lab).toFixed(1) + '</em>'); }).join('');
  h += '<div class="ct" style="margin-top:14px">가까운 색</div>' + nn.map(function (x) { return swl(x[1], '<em>ΔE ' + x[0].toFixed(1) + '</em>'); }).join('');
  h += '<div class="nt" style="margin-top:10px">CMYK는 화면값으로 계산한 근사치예요. 4도 재현은 PANTONE Color Bridge 기준으로 인쇄소와 확인하세요. 코팅지(C)와 비코팅지(U)는 같은 번호도 색이 달라 보여요.</div></div></div>';
  el.innerHTML = h; el.style.display = 'flex'; document.body.style.overflow = 'hidden';
  var close = function () { el.style.display = 'none'; el.innerHTML = ''; document.body.style.overflow = ''; };
  $('#pkX').onclick = close; el.onclick = function (e) { if (e.target === el) close(); };
  $('#ptFv').onclick = function () { var i = PT.fav.indexOf(key); if (i < 0) PT.fav.push(key); else PT.fav.splice(i, 1); ls.set('pr:ptfav', JSON.stringify(PT.fav)); ptDetail(c); if (S.view === 'pt') renderPt(); };
  el.querySelectorAll('[data-cp]').forEach(function (b) { b.onclick = function () { copyText(b.dataset.cp, '‘' + b.dataset.cp + '’ 복사했어요'); }; });
  el.querySelectorAll('[data-pc]').forEach(function (b) { b.onclick = function () { var p = b.dataset.pc.split(':'); ptDetail(PT.L[p[0]][+p[1]]); }; });
}
