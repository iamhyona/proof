<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPEC</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPEC">
<meta name="theme-color" content="#f2f4f6">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { --bg:#f2f4f6; --card:#fff; --line:#e5e8eb; --txt:#191f28; --sub:#4e5968; --mute:#8b95a1; --faint:#b0b8c1; --acc:#3182f6; --red:#ef4444; --chip:#f2f4f6; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--txt); font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif; font-size:15px; letter-spacing:-0.01em; }
button,input,select,textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; }
header { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(10px + env(safe-area-inset-top)) 16px 0; }
.hd { display:flex; align-items:center; justify-content:space-between; height:44px; max-width:560px; margin:0 auto; }
.brand { border:0; background:none; padding:0; font-size:17px; font-weight:800; letter-spacing:.06em; }
.hdt { font-size:12px; color:var(--mute); font-weight:600; }
nav { display:flex; gap:20px; max-width:560px; margin:6px auto 0; border-bottom:1px solid var(--line); }
nav button { border:0; background:none; padding:12px 0 10px; font-size:12px; font-weight:700; letter-spacing:.03em; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button.on { color:var(--txt); border-bottom-color:var(--txt); }
main { max-width:560px; margin:0 auto; padding:14px 16px calc(80px + env(safe-area-inset-bottom)); }
.card { background:var(--card); border-radius:20px; padding:20px 18px; margin-bottom:12px; }
.ct { font-size:16px; font-weight:700; margin:0 0 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ct small { font-size:13px; font-weight:500; color:var(--mute); }
.sec { font-size:13px; font-weight:800; color:var(--sub); margin:20px 4px 10px; display:flex; gap:8px; align-items:baseline; } .sec small { font-weight:600; color:var(--mute); }
.empty2 { text-align:center; color:var(--mute); padding:18px 0; font-size:14px; }
.legend { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--mute); margin-top:8px; }
.dn { color:var(--red); }
.phd { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 4px 14px; } .phd b { font-size:20px; font-weight:800; } .phd small { width:100%; color:var(--mute); font-size:13px; font-weight:600; }
.bk { width:34px; height:34px; border-radius:50%; border:0; background:#fff; font-size:18px; color:var(--sub); }
.seg { display:flex; background:#e5e8eb; border-radius:12px; padding:3px; margin:0 0 12px; }
.seg button { flex:1; border:0; background:none; border-radius:9px; padding:8px 0; font-size:14px; font-weight:700; color:var(--mute); }
.seg button.on { background:#fff; color:var(--txt); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.chips { display:flex; flex-wrap:wrap; gap:6px; } .chips button { border:0; background:var(--chip); border-radius:999px; padding:8px 13px; font-size:14px; color:var(--sub); font-weight:500; } .chips button.on { background:var(--txt); color:#fff; }
.frow { display:flex; gap:8px; margin-bottom:10px; }
.f { flex:1; min-width:0; } .f label { display:block; font-size:12px; color:var(--mute); margin:0 0 5px 2px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .f label i { font-style:normal; font-weight:500; opacity:.8; }
.f input, .f select { width:100%; border:0; background:var(--chip); border-radius:12px; padding:0 12px; outline:0; font-size:16px; height:46px; min-width:0; display:block; -webkit-appearance:none; appearance:none; }
.ig { display:grid; grid-template-columns:repeat(3,1fr); gap:10px 8px; }
.nt { margin-top:12px; font-size:12px; color:var(--mute); line-height:1.55; } .nt.c { text-align:center; margin:8px 0 0; }
.tg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.tg button { border:0; background:#fff; border-radius:16px; padding:16px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; min-width:0; }
.tg b { font-size:15px; } .tg small { font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cl { display:grid; grid-template-columns:auto 1fr; gap:10px 14px; margin:0; } .cl dt { font-size:13px; color:var(--mute); font-weight:600; } .cl dd { margin:0; font-size:15px; font-weight:700; text-align:right; }
.rw .rh { margin:0 0 10px; } .rw .rh b { display:block; font-size:15px; } .rw .rh small { display:block; font-size:12px; color:var(--mute); margin-top:3px; line-height:1.45; }
.fr { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); padding:6px 0; } .fr span { flex:none; width:7.4em; font-size:12px; color:var(--mute); font-weight:600; }
.fr input { flex:1; min-width:0; border:0; background:none; font-size:14px; padding:8px 0; outline:0; text-align:right; } .fr input:focus { background:var(--chip); border-radius:8px; padding:8px; text-align:left; }
.sh { margin-top:8px; background:var(--chip); border-radius:12px; padding:10px 12px; font-size:12px; color:var(--sub); line-height:1.5; } .sh b { color:var(--acc); }
.cp { width:100%; border:0; border-radius:14px; background:var(--acc); color:#fff; font-weight:800; font-size:15px; padding:15px 0; margin-top:4px; }
.acts { display:flex; gap:8px; margin-top:12px; } .acts button { flex:1; border:0; border-radius:12px; padding:12px 0; font-weight:700; font-size:14px; } .sv { background:var(--txt); color:#fff; } .rs { background:#fff; color:var(--sub); }
.tt { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; } .tt div { background:var(--chip); border-radius:12px; padding:10px; } .tt small { display:block; font-size:11px; color:var(--mute); font-weight:600; } .tt b { font-size:17px; } .tt b i { font-style:normal; font-size:11px; color:var(--sub); margin-left:1px; }
.tx { margin:0; font-size:14px; line-height:1.7; color:var(--sub); } .tx b { color:var(--txt); }
#toast { position:fixed; left:50%; bottom:calc(30px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(25,31,40,.92); color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; display:none; z-index:50; white-space:nowrap; }
@media (max-width:380px) { .ig { grid-template-columns:1fr 1fr; } }
.cpre { margin:0 0 12px; } .cpre button small { margin-left:5px; font-size:11px; opacity:.6; }
.cres .ct span { display:flex; align-items:center; gap:6px; } .cbest { font-style:normal; font-size:11px; font-weight:800; color:#fff; background:var(--acc); border-radius:999px; padding:2px 7px; }
.cres.best { box-shadow:inset 0 0 0 2px var(--acc); }
.cst { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:0 0 12px; } .cst > div { background:var(--chip); border-radius:14px; padding:12px 12px 10px; min-width:0; }
.cst small { display:block; font-size:11px; color:var(--mute); font-weight:600; } .cst b { display:block; font-size:22px; font-weight:800; letter-spacing:-0.02em; margin-top:4px; white-space:nowrap; } .cst b i { font-style:normal; font-size:12px; color:var(--sub); margin:0 1px; font-weight:700; }
.cst em { display:block; font-style:normal; font-size:11px; color:var(--mute); margin-top:2px; } .cst.sm { margin:12px 0 0; } .cst.sm b { font-size:18px; }
.csv { display:block; width:100%; height:auto; margin:2px 0 6px; } .cds { font-size:12px; color:var(--mute); }
.cwarn, .cok { margin-top:10px; font-size:13px; border-radius:12px; padding:10px 12px; line-height:1.5; } .cwarn { background:#fff4e5; color:#b45309; } .cok { background:#e8f7ee; color:#1f9d55; }
.cpy { margin-top:12px; width:100%; border:0; border-radius:12px; background:var(--txt); color:#fff; font-weight:700; font-size:14px; padding:12px 0; }
.cfit { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; } .cfit small { width:100%; font-size:12px; color:var(--mute); font-weight:600; } .cfit button { border:0; background:var(--chip); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--sub); }
.cset summary { list-style:none; cursor:pointer; margin:0; } .cset summary::-webkit-details-marker { display:none; }
#cP button { font-size:13px; }
.cst.c2 { grid-template-columns:1.6fr 1fr; }

</style>
</head>
<body>
<header>
  <div class="hd"><button class="brand" id="brand">SPEC</button><span class="hdt">사양서 도우미</span></div>
  <nav id="nav"><button data-v="list">품목</button><button data-v="calc">절수</button><button data-v="paper">용지</button></nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<datalist id="papers"></datalist>
<script>
/* ───── CALC: 국전·46전 절수 · 판걸이 · 로스 계산 (2026.10.06) ─────
   전지: 46전 788×1091 · 국전 636×939 (mm)
   여유 기본값: 도련 사방 3mm · 물림 10mm(긴 변 쪽) · 나머지 여백 5mm — 인쇄소마다 달라서 고칠 수 있게 */
var PAPERS = [{ k: '46', n: '46전', s: 788, l: 1091 }, { k: 'kuk', n: '국전', s: 636, l: 939 }];
var PRESETS = [['국판', 148, 210], ['신국판', 152, 225], ['46판', 128, 188], ['크라운판', 176, 248], ['46배판', 188, 257], ['국배판(A4)', 210, 297],
  ['B5', 182, 257], ['A3', 297, 420], ['엽서', 100, 148], ['포토카드', 55, 85], ['스티커 A6', 105, 148]];
var CUTS = [2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64];
function cq() {
  var d = { t: 'book', m: 'size', w: 148, h: 210, p: 64, q: 500, sp: 8, fl: 0, cw: 148, ch: 210, bl: 3, gr: 10, sd: 5, ex: 5, paper: '46', cut: 16 };
  try { var o = JSON.parse(ls.get('d4:calc') || 'null'); if (o) for (var k in o) d[k] = o[k]; } catch (e) {}
  return d;
}
function cqSave(c) { try { ls.set('d4:calc', JSON.stringify(c)); } catch (e) {} }
function pow2(n) { var p = 1; while (p * 2 <= n) p *= 2; return n >= 1 ? p : 0; }
// 전지 한 장에 몇 개: 그대로 · 돌려서 · 섞어서(남는 띠에 돌려 넣기). 책자는 접지 때문에 가로·세로 2의 거듭제곱 격자만
function fitSheet(P, iw, ih, c, book) {
  var uL = P.l - 2 * c.sd, uS = P.s - c.gr - c.sd, best = { n: 0 };
  if (iw <= 0 || ih <= 0 || uL <= 0 || uS <= 0) return best;
  var put = function (n, rects, desc) { if (n > best.n) best = { n: n, rects: rects, desc: desc }; };
  [[iw, ih], [ih, iw]].forEach(function (o, r) {
    var a = o[0], b = o[1], cols = Math.floor(uL / a), rows = Math.floor(uS / b);
    if (book) { cols = pow2(cols); rows = pow2(rows); }
    var rects = []; for (var i = 0; i < cols; i++) for (var j = 0; j < rows; j++) rects.push([i * a, j * b, a, b, r]);
    put(cols * rows, rects, cols + '×' + rows + (r ? ' (돌려서)' : ''));
    if (book) return;
    // 아래쪽 남는 띠에 돌려서 더 넣기
    for (var k = 0; k <= Math.floor(uS / b); k++) {
      var rem = uS - k * b, c1 = Math.floor(uL / a), c2 = Math.floor(uL / b), r2 = Math.floor(rem / a), n = k * c1 + c2 * r2;
      if (n > best.n && r2 > 0 && k > 0) {
        var rs = []; for (i = 0; i < c1; i++) for (j = 0; j < k; j++) rs.push([i * a, j * b, a, b, r]);
        for (i = 0; i < c2; i++) for (j = 0; j < r2; j++) rs.push([i * b, k * b + j * a, b, a, 1 - r]);
        put(n, rs, c1 + '×' + k + ' + ' + c2 + '×' + r2 + ' 섞어서');
      }
    }
    // 오른쪽 남는 띠에 돌려서 더 넣기
    for (k = 0; k <= Math.floor(uL / a); k++) {
      var remL = uL - k * a, r1 = Math.floor(uS / b), c3 = Math.floor(remL / b), r3 = Math.floor(uS / a), n2 = k * r1 + c3 * r3;
      if (n2 > best.n && c3 > 0 && k > 0) {
        var rs2 = []; for (i = 0; i < k; i++) for (j = 0; j < r1; j++) rs2.push([i * a, j * b, a, b, r]);
        for (i = 0; i < c3; i++) for (j = 0; j < r3; j++) rs2.push([k * a + i * b, j * a, b, a, 1 - r]);
        put(n2, rs2, k + '×' + r1 + ' + ' + c3 + '×' + r3 + ' 섞어서');
      }
    }
  });
  best.uL = uL; best.uS = uS;
  return best;
}
// 표준 절 칸 크기 (긴 변부터 반씩, 3·6·12…절은 긴 변 3등분 후 반씩)
function cutCell(P, n) {
  var L = P.l, Sx = P.s, k = n;
  if (n % 3 === 0) { L = L / 3; k = n / 3; if (L < Sx) { var t0 = L; L = Sx; Sx = t0; } }
  while (k > 1) { L = L / 2; k /= 2; if (L < Sx) { var t = L; L = Sx; Sx = t; } }
  return [Math.floor(Sx), Math.floor(L)];
}
function cutName(P, n) { return P.n + ' ' + n + '절'; }
// 결과 그림: 전지 · 여백(물림) · 배치
function sheetSvg(P, f, c) {
  var W = P.l, H = P.s, sc = 300 / W, h = H * sc, s = '';
  s += '<rect x="0" y="0" width="' + (W * sc).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="#f2f4f6"/>';
  s += '<rect x="0" y="' + ((H - c.gr) * sc).toFixed(1) + '" width="' + (W * sc).toFixed(1) + '" height="' + (c.gr * sc).toFixed(1) + '" fill="#fde2e2"/>';
  (f.rects || []).forEach(function (r) {
    s += '<rect x="' + ((c.sd + r[0]) * sc).toFixed(1) + '" y="' + ((c.sd + r[1]) * sc).toFixed(1) + '" width="' + (r[2] * sc - 0.8).toFixed(1) + '" height="' + (r[3] * sc - 0.8).toFixed(1) + '" rx="1.5" fill="' + (r[4] ? '#a5c8fb' : '#3182f6') + '" fill-opacity=".85"/>';
  });
  return '<svg class="csv" viewBox="0 0 300 ' + h.toFixed(1) + '">' + s + '</svg>';
}
function fmtN(v, d) { return (+v).toLocaleString(undefined, { maximumFractionDigits: d || 0 }); }
function yeon(sheets) { return fmtN(sheets / 500, 2) + '연'; }
// 한 품목(크기 → 전지별 결과) 계산
function calcItem(fw, fh, c, book) {
  // 책자는 접어서 붙어 있는 쪽끼리 도련을 나눠 쓰므로 쪽마다 도련 한 번, 낱장·전개도는 사방 도련
  var bb = book ? +c.bl : 2 * c.bl, iw = fw + bb, ih = fh + bb;
  return PAPERS.map(function (P) {
    var f = fitSheet(P, iw, ih, c, book), use = f.n ? f.n * fw * fh / (P.s * P.l) : 0;
    return { P: P, f: f, n: f.n, use: use, loss: 1 - use };
  }).sort(function (a, b) { return (b.n ? 1 : 0) - (a.n ? 1 : 0) || a.loss - b.loss; });
}
function resCard(r, i, extra, spec) {
  if (!r.n) return '<div class="card cres"><div class="ct">' + r.P.n + '<small>' + r.P.s + '×' + r.P.l + '</small></div><div class="empty2">이 크기는 ' + r.P.n + '에 안 들어가요</div></div>';
  return '<div class="card cres' + (i === 0 ? ' best' : '') + '"><div class="ct"><span>' + r.P.n + (i === 0 ? '<em class="cbest">추천</em>' : '') + '</span><small>' + r.P.s + '×' + r.P.l + 'mm</small></div>' +
    '<div class="cst"><div><small>전지 1장에</small><b>' + r.n + '<i>개</i></b></div><div><small>사용률</small><b>' + Math.round(r.use * 100) + '<i>%</i></b></div><div><small>로스</small><b class="' + (r.loss > .35 ? 'dn' : '') + '">' + Math.round(r.loss * 100) + '<i>%</i></b></div></div>' +
    sheetSvg(r.P, r.f, CQ) + '<div class="cds">배치 ' + esc(r.f.desc) + ' · 빨간 띠 = 물림</div>' + (extra || '') +
    (spec ? '<button class="cpy" data-cpy="' + esc(spec) + '">사양서용 복사</button>' : '') + '</div>';
}
var CQ = null;
function renderCalc() {
  var c = CQ = cq(), h = '';
  h += '<div class="seg" id="cT">' + [['book', '책자'], ['sheet', '낱장'], ['pack', '전개도']].map(function (o) { return '<button data-t="' + o[0] + '" class="' + (c.t === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="seg" id="cM">' + [['size', '사이즈 → 추천'], ['cut', '절수 → 판형']].map(function (o) { return '<button data-m="' + o[0] + '" class="' + (c.m === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div>';
  var num = function (k, lb, unit, step) { return '<div class="f"><label>' + lb + (unit ? ' (' + unit + ')' : '') + '</label><input type="number" inputmode="decimal" data-k="' + k + '" value="' + c[k] + '"' + (step ? ' step="' + step + '"' : '') + '></div>'; };
  if (c.m === 'size') {
    h += '<div class="card"><div class="ct">' + (c.t === 'pack' ? '펼친 크기 (전개도)' : '완성 크기') + '<small>재단 후</small></div>';
    if (c.t !== 'pack') h += '<div class="chips cpre">' + PRESETS.map(function (p) { return '<button data-pw="' + p[1] + '" data-ph="' + p[2] + '" class="' + (+c.w === p[1] && +c.h === p[2] ? 'on' : '') + '">' + p[0] + '<small>' + p[1] + '×' + p[2] + '</small></button>'; }).join('') + '</div>';
    h += '<div class="frow">' + num(c.t === 'pack' ? 'cw' : 'w', '가로', 'mm') + num(c.t === 'pack' ? 'ch' : 'h', '세로', 'mm') + '</div>';
    if (c.t === 'book') h += '<div class="frow">' + num('p', '본문', '쪽') + num('q', '부수', '부') + '</div><div class="frow">' + num('sp', '책등', 'mm', '0.5') + num('fl', '날개', 'mm') + '</div>';
    else h += '<div class="frow">' + num('q', '수량', '개') + num('ex', '여분', '%') + '</div>';
    h += '</div>';
  } else {
    h += '<div class="card"><div class="ct">전지 · 절수</div><div class="seg" id="cP">' + PAPERS.map(function (P) { return '<button data-pp="' + P.k + '" class="' + (c.paper === P.k ? 'on' : '') + '">' + P.n + ' ' + P.s + '×' + P.l + '</button>'; }).join('') + '</div>' +
      '<div class="chips">' + CUTS.map(function (n) { return '<button data-cut="' + n + '" class="' + (+c.cut === n ? 'on' : '') + '">' + n + '절</button>'; }).join('') + '</div></div>';
  }
  h += '<details class="card cset"><summary class="ct">여유 설정<small>도련 ' + c.bl + ' · 물림 ' + c.gr + ' · 여백 ' + c.sd + 'mm</small></summary><div class="frow" style="margin-top:12px">' + num('bl', '도련(사방)', 'mm') + num('gr', '물림', 'mm') + num('sd', '여백', 'mm') + '</div>' +
    (c.t === 'book' ? '<div class="frow">' + num('ex', '여분', '%') + '</div>' : '') + '<div class="legend" style="justify-content:flex-start">인쇄소마다 물림·여백이 달라요 · 결(종목/횡목) 방향은 인쇄소와 확인</div></details>';
  h += '<div id="cRes">' + calcOut(c) + '</div>';
  $('#main').innerHTML = h; bindCalc();
}
function calcOut(c) {
  var w = +c.w, hh = +c.h, q = Math.max(0, +c.q || 0), ex = 1 + (+c.ex || 0) / 100, out = '';
  if (c.m === 'cut') {

$$('#nav button').forEach(function (b) { b.onclick = function () { S.view = b.dataset.v; ls.set('sp:view', S.view); window.scrollTo(0, 0); render(); }; });
$('#brand').onclick = function () { S.view = 'list'; ls.set('sp:view', 'list'); window.scrollTo(0, 0); render(); };
$('#papers').innerHTML = PAPER_LIST.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('');
render();

</script>
