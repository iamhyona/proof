<style>

.hdr { display:flex; align-items:center; gap:10px; } .lnk { width:32px; height:32px; border-radius:50%; background:#fff; color:var(--sub); display:flex; align-items:center; justify-content:center; }

.racts { display:flex; gap:6px; margin-top:10px; } .racts button { flex:1; border:0; background:var(--chip); border-radius:10px; padding:9px 0; font-size:13px; font-weight:600; color:var(--sub); } .del { color:var(--red) !important; }
.fr select { flex:1; min-width:0; border:0; background:none; font-size:14px; padding:8px 0; outline:0; text-align:right; direction:rtl; }
.fx { border-top:1px solid var(--line); padding:9px 0; font-size:13px; line-height:1.45; } .fx small { display:block; color:var(--mute); font-size:11px; } .fx s { color:var(--mute); margin-right:6px; } .fx b { color:var(--txt); font-weight:600; }

.pi { border-top:1px solid var(--line); padding:12px 0; } .pi:first-child { border-top:0; padding-top:0; }
.pn b { font-size:15px; } .pn em { font-style:normal; font-size:11px; font-weight:700; color:var(--acc); background:#e8f3ff; border-radius:6px; padding:2px 6px; margin-left:6px; } .pn small { display:block; font-size:12px; color:var(--mute); margin-top:3px; }
.gs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .gs button { border:0; background:var(--chip); border-radius:10px; padding:6px 10px; text-align:center; min-width:54px; } .gs b { font-size:15px; font-weight:800; display:block; } .gs b i { font-style:normal; font-size:11px; color:var(--sub); margin-left:1px; } .gs small { display:block; font-size:10px; color:var(--faint); margin-top:1px; }
.cols { margin-top:8px; } .cols summary { font-size:12px; color:var(--acc); font-weight:600; cursor:pointer; } .cols .chips { margin-top:8px; } .cols .chips button { padding:5px 10px; font-size:12px; }
.dsv { display:block; width:100%; height:auto; max-height:62vh; background:#fafbfc; border-radius:12px; margin:2px 0 8px; }

<body>
<header>
  <div class="hd"><button class="brand" id="brand">PROOF</button><span class="hdr"><span class="hdt">사양서 도우미</span><a class="lnk" id="lnk" target="_blank" rel="noopener" aria-label="시트·폴더 열기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg></a></span></div>
  <nav id="nav"><button data-v="doc">사양서</button><button data-v="list">품목</button><button data-v="die">전개도</button><button data-v="calc">절수</button><button data-v="ref">자료</button></nav>
</header>
<main id="main"></main>
<div id="toast"></div>
<datalist id="dl-paper"></datalist><datalist id="dl-print"></datalist><datalist id="dl-coat"></datalist><datalist id="dl-fin"></datalist><datalist id="dl-cut"></datalist><datalist id="dl-bind"></datalist><datalist id="dl-pack"></datalist>
<script>
/* ───── CALC: 국전·46전 절수 · 판걸이 · 로스 계산 (2026.10.06) ─────
   전지: 46전 788×1091 · 국전 636×939 (mm)
   여유 기본값: 도련 사방 3mm · 물림 10mm(긴 변 쪽) · 나머지 여백 5mm — 인쇄소마다 달라서 고칠 수 있게 */
var PAPERS = [{ k: '46', n: '46전', s: 788, l: 1091 }, { k: 'kuk', n: '국전', s: 636, l: 939 }];
// 결: 종목(T) = 결이 긴 변 방향 · 횡목(Y) = 짧은 변 방향
var PAPERS_G = [{ k: '46T', n: '46전 종목', s: 788, l: 1091, g: 'L' }, { k: '46Y', n: '46전 횡목', s: 788, l: 1091, g: 'S' }, { k: 'kukT', n: '국전 종목', s: 636, l: 939, g: 'L' }, { k: 'kukY', n: '국전 횡목', s: 636, l: 939, g: 'S' }];
var PRESETS = [['국판', 148, 210], ['신국판', 152, 225], ['46판', 128, 188], ['크라운판', 176, 248], ['46배판', 188, 257], ['국배판(A4)', 210, 297],
  ['B5', 182, 257], ['A3', 297, 420], ['엽서', 100, 148], ['포토카드', 55, 85], ['스티커 A6', 105, 148]];
var CUTS = [2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64];
function cq() {
  var d = { t: 'book', m: 'size', w: 148, h: 210, p: 64, q: 500, sp: 8, fl: 0, cw: 148, ch: 210, bl: 3, gr: 10, sd: 5, ex: 5, paper: '46', cut: 16 };
  try { var o = JSON.parse(ls.get('pr:calc') || 'null'); if (o) for (var k in o) d[k] = o[k]; } catch (e) {}
  return d;
}
function cqSave(c) { try { ls.set('pr:calc', JSON.stringify(c)); } catch (e) {} }
function pow2(n) { var p = 1; while (p * 2 <= n) p *= 2; return n >= 1 ? p : 0; }
// 전지 한 장에 몇 개: 그대로 · 돌려서 · 섞어서(남는 띠에 돌려 넣기). 책자는 접지 때문에 가로·세로 2의 거듭제곱 격자만
function fitSheet(P, iw, ih, c, book, gn) {
  var uL = P.l - 2 * c.sd, uS = P.s - c.gr - c.sd, best = { n: 0 };
  // 결 맞추기: r=0이면 세로(ih)가 전지 짧은 변 방향. 세로결 품목은 결이 그 방향인 전지에만
  var okR = function (r) { if (!gn || !P.g) return true; var hOnS = r === 0; return gn === 'v' ? (hOnS ? P.g === 'S' : P.g === 'L') : (hOnS ? P.g === 'L' : P.g === 'S'); };
  if (iw <= 0 || ih <= 0 || uL <= 0 || uS <= 0) return best;
  var put = function (n, rects, desc) { if (n > best.n) best = { n: n, rects: rects, desc: desc }; };
  [[iw, ih], [ih, iw]].forEach(function (o, r) {
    if (!okR(r)) return;
    var a = o[0], b = o[1], cols = Math.floor(uL / a), rows = Math.floor(uS / b);
    if (book) { cols = pow2(cols); rows = pow2(rows); }
    var rects = []; for (var i = 0; i < cols; i++) for (var j = 0; j < rows; j++) rects.push([i * a, j * b, a, b, r]);
    put(cols * rows, rects, cols + '×' + rows + (r ? ' (돌려서)' : ''));
    if (book || (gn && P.g)) return;
    // 아래쪽 남는 띠에 돌려서 더 넣기
    for (var k = 0; k <= Math.floor(uS / b); k++) {
      var rem = uS - k * b, c1 = Math.floor(uL / a), c2 = Math.floor(uL / b), r2 = Math.floor(rem / a), n = k * c1 + c2 * r2;
      if (n > best.n && r2 > 0 && k > 0) {
        var rs = []; for (i = 0; i < c1; i++) for (j = 0; j < k; j++) rs.push([i * a, j * b, a, b, r]);
        for (i = 0; i < c2; i++) for (j = 0; j < r2; j++) rs.push([i * b, k * b + j * a, b, a, 1 - r]);
        put(n, rs, c1 + '×' + k + ' + ' + c2 + '×' + r2 + ' 섞어서');
      }
    }
    // 오른쪽 남는 띠에 돌려서 더 넣기
    for (k = 0; k <= Math.floor(uL / a); k++) {
      var remL = uL - k * a, r1 = Math.floor(uS / b), c3 = Math.floor(remL / b), r3 = Math.floor(uS / a), n2 = k * r1 + c3 * r3;
      if (n2 > best.n && c3 > 0 && k > 0) {
        var rs2 = []; for (i = 0; i < k; i++) for (j = 0; j < r1; j++) rs2.push([i * a, j * b, a, b, r]);
        for (i = 0; i < c3; i++) for (j = 0; j < r3; j++) rs2.push([k * a + i * b, j * a, b, a, 1 - r]);
        put(n2, rs2, k + '×' + r1 + ' + ' + c3 + '×' + r3 + ' 섞어서');
      }
    }
  });
  best.uL = uL; best.uS = uS;
  return best;
}
// 표준 절 칸 크기 (긴 변부터 반씩, 3·6·12…절은 긴 변 3등분 후 반씩)
function cutCell(P, n) {
  var L = P.l, Sx = P.s, k = n;
  if (n % 3 === 0) { L = L / 3; k = n / 3; if (L < Sx) { var t0 = L; L = Sx; Sx = t0; } }
  while (k > 1) { L = L / 2; k /= 2; if (L < Sx) { var t = L; L = Sx; Sx = t; } }
  return [Math.floor(Sx), Math.floor(L)];
}
function cutName(P, n) { return P.n + ' ' + n + '절'; }
// 결과 그림: 전지 · 여백(물림) · 배치
function sheetSvg(P, f, c) {
  var W = P.l, H = P.s, sc = 300 / W, h = H * sc, s = '';
  s += '<rect x="0" y="0" width="' + (W * sc).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="#f2f4f6"/>';
  s += '<rect x="0" y="' + ((H - c.gr) * sc).toFixed(1) + '" width="' + (W * sc).toFixed(1) + '" height="' + (c.gr * sc).toFixed(1) + '" fill="#fde2e2"/>';
  (f.rects || []).forEach(function (r) {
    s += '<rect x="' + ((c.sd + r[0]) * sc).toFixed(1) + '" y="' + ((c.sd + r[1]) * sc).toFixed(1) + '" width="' + (r[2] * sc - 0.8).toFixed(1) + '" height="' + (r[3] * sc - 0.8).toFixed(1) + '" rx="1.5" fill="' + (r[4] ? '#a5c8fb' : '#3182f6') + '" fill-opacity=".85"/>';
  });
  return '<svg class="csv" viewBox="0 0 300 ' + h.toFixed(1) + '">' + s + '</svg>';
}
function fmtN(v, d) { return (+v).toLocaleString(undefined, { maximumFractionDigits: d || 0 }); }
function yeon(sheets) { return fmtN(sheets / 500, 2) + '연'; }
// 한 품목(크기 → 전지별 결과) 계산
function calcItem(fw, fh, c, book) {
  // 책자는 접어서 붙어 있는 쪽끼리 도련을 나눠 쓰므로 쪽마다 도련 한 번, 낱장·전개도는 사방 도련
  var bb = book ? +c.bl : 2 * c.bl, iw = fw + bb, ih = fh + bb;
  var gn = book ? 'v' : (c.gn || '');
  return (gn ? PAPERS_G : PAPERS).map(function (P) {
    var f = fitSheet(P, iw, ih, c, book, gn), use = f.n ? f.n * fw * fh / (P.s * P.l) : 0;
    return { P: P, f: f, n: f.n, use: use, loss: 1 - use };
  }).sort(function (a, b) { return (b.n ? 1 : 0) - (a.n ? 1 : 0) || a.loss - b.loss; });
}
function resCard(r, i, extra, spec) {

var API = 'https://script.google.com/macros/s/AKfycbwFtL_qIuUMOxdD5wzj6Eltc67OTIScR4yJjMZWxLyPzn8K7Y5JhOBTDlf4wp9Av6lqSQ/exec';

function dieAI(file) {

    }).catch(function (e) { if (/PIN/.test(e.message)) ls.set('pr:pin', ''); box.textContent = e.message; });
  };

}
